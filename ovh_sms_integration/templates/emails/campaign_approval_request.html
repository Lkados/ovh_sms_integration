<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demande d'approbation campagne SMS</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        h3 {
            color: #e67e22;
            border-bottom: 2px solid #e67e22;
            padding-bottom: 10px;
        }
        .info-box {
            background-color: #fff3cd;
            border-left: 4px solid #e67e22;
            padding: 15px;
            margin: 15px 0;
        }
        .info-row {
            margin: 10px 0;
        }
        .info-row strong {
            display: inline-block;
            width: 150px;
            color: #555;
        }
        .action-button {
            display: inline-block;
            background-color: #3498db;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
            font-weight: bold;
        }
        .action-button:hover {
            background-color: #2980b9;
        }
        .footer {
            margin-top: 30px;
            padding-top: 15px;
            border-top: 1px solid #ddd;
            font-size: 0.9em;
            color: #7f8c8d;
        }
    </style>
</head>
<body>
    <h3>Demande d'approbation de campagne SMS</h3>

    <div class="info-box">
        <div class="info-row">
            <strong>Campagne:</strong> {{ campaign }}
        </div>
        <div class="info-row">
            <strong>Demandeur:</strong> {{ requested_by }}
        </div>
        <div class="info-row">
            <strong>Nombre de SMS:</strong> {{ sms_count }}
        </div>
        <div class="info-row">
            <strong>Coût estimé:</strong> {{ estimated_cost }}€
        </div>
        <div class="info-row">
            <strong>Raison:</strong> {{ reason }}
        </div>
    </div>

    <p>
        <a href="{{ approval_link }}" class="action-button">Voir la demande</a>
    </p>

    <div class="footer">
        <small>Cette notification a été générée automatiquement par le système de gestion SMS.</small>
    </div>
</body>
</html>
