name: Code Quality

on:
  push:
    branches: [ main, develop, feature/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Linting & Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 isort bandit

      - name: Check code formatting with Black
        run: |
          black --check ovh_sms_integration/ || (echo "Code needs formatting. Run: black ovh_sms_integration/" && exit 1)

      - name: Check import sorting with isort
        run: |
          isort --check-only ovh_sms_integration/ || (echo "Imports need sorting. Run: isort ovh_sms_integration/" && exit 1)

      - name: Lint with Flake8
        run: |
          flake8 ovh_sms_integration/ --max-line-length=100 --extend-ignore=E203,W503 --count --show-source --statistics

      - name: Security check with Bandit
        run: |
          bandit -r ovh_sms_integration/ -ll || true
        continue-on-error: true
